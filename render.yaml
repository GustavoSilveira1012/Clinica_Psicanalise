# Synthetic-data homologation only. The frontend stays on Cloudflare, which
# proxies /backend/* to this API on the same browser origin. Clinical data,
# public checkout and public trial remain disabled.
services:
  - type: web
    name: psicogest-synthetic-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/psicogest/psicogest/Dockerfile
    dockerContext: ./backend/psicogest/psicogest
    autoDeployTrigger: 'off'
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SERVER_PORT
        value: "8080"
      - key: CLINICAL_ONLY_PILOT
        value: "true"
      - key: CLINICAL_DATA_ENABLED
        value: "false"
      - key: CLINICAL_DATA_RELEASE_APPROVED
        value: "false"
      - key: SCHEDULING_ENABLED
        value: "false"
      - key: AUTH_ACTION_MAIL_ENABLED
        value: "false"
      - key: AUTH_ACTION_MAIL_REQUIRED_FOR_READINESS
        value: "false"
      - key: REQUIRE_REAL_PROVIDERS
        value: "false"
      - key: REQUIRE_PAYMENT_PROVIDERS
        value: "false"
      - key: REQUIRE_NOTIFICATION_PROVIDERS
        value: "false"
      - key: NOTIFICATION_OUTBOX_SCHEDULER_ENABLED
        value: "false"
      - key: NOTIFICATION_OUTBOX_ORGANIZATION_IDS
        value: ""
      - key: REQUIRE_NATIONAL_NFSE
        value: "false"
      - key: CLINICAL_EXPORT_STORAGE_TYPE
        value: disabled
      - key: CLINICAL_EXPORT_STORAGE_REQUIRED
        value: "false"
      - key: CLINICAL_EXPORT_RETENTION_ENABLED
        value: "false"
      - key: CLINICAL_EXPORT_RETENTION_ORGANIZATION_IDS
        value: ""
      - key: JWT_COOKIE_SECURE
        value: "true"
      - key: JPA_SHOW_SQL
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SECURITY_ALLOWED_ORIGINS
        sync: false
      - key: JWT_PUBLIC_KEY_LOCATION
        value: file:/etc/secrets/jwt-public.pem
      - key: JWT_PRIVATE_KEY_LOCATION
        value: file:/etc/secrets/jwt-private.pem
      - key: JWT_KEY_ID
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: CLINICAL_KEK
        sync: false
      - key: AUDIT_HMAC_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      # Render's same-region private Key Value URL uses redis://, not rediss://.
      # This is synthetic-only; external traffic stays blocked.
      - key: REDIS_SSL_ENABLED
        value: "false"
      - key: PUBLIC_PLANS_ENABLED
        value: "false"
      - key: PUBLIC_PRICING_APPROVED
        value: "false"
      - key: PUBLIC_TRIAL_ENABLED
        value: "false"
      - key: PUBLIC_CHECKOUT_ENABLED
        value: "false"
