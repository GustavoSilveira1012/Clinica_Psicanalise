name: Configure PsicoGest database role passwords

# Runs only after reviewed changes to the role setup, on the approved branch.
on:
  push:
    branches:
      - codex/render-homologacao
    paths:
      - .github/workflows/configure-supabase-role-passwords.yml
      - ops/configure_supabase_role_passwords.py

permissions:
  contents: read

concurrency:
  group: psicogest-role-passwords
  cancel-in-progress: false

jobs:
  configure:
    if: github.repository == 'GustavoSilveira1012/Clinica_Psicanalise'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PostgreSQL client
        run: python -m pip install 'psycopg[binary]==3.3.6'
      - name: Configure and authenticate the two roles
        env:
          PSICOGEST_SUPABASE_DB_PASSWORD: ${{ secrets.PSICOGEST_SUPABASE_DB_PASSWORD }}
          PSICOGEST_RUNTIME_DB_PASSWORD: ${{ secrets.PSICOGEST_RUNTIME_DB_PASSWORD }}
          BACKUP_SUPABASE_DATABASE_PASSWORD: ${{ secrets.BACKUP_SUPABASE_DATABASE_PASSWORD }}
        run: python ops/configure_supabase_role_passwords.py
