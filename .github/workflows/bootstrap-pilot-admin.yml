name: Bootstrap first PsicoGest pilot administrator

# This job is inert until the owner deliberately sets the exact repository
# variable and a private initial password. It cannot create a second user.
on:
  push:
    branches:
      - codex/render-homologacao
    paths:
      - .github/workflows/bootstrap-pilot-admin.yml
      - ops/bootstrap_pilot_admin.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psicogest-first-admin-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.repository == 'GustavoSilveira1012/Clinica_Psicanalise' &&
      vars.PILOT_ADMIN_BOOTSTRAP_CONFIRMATION == 'BOOTSTRAP-PSICOGEST-FIRST-ADMIN'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned database and password tools
        run: python -m pip install 'psycopg[binary]==3.3.6' 'bcrypt==4.2.1'
      - name: Create first administrator only if the database has no users
        env:
          PILOT_ADMIN_BOOTSTRAP_CONFIRMATION: ${{ vars.PILOT_ADMIN_BOOTSTRAP_CONFIRMATION }}
          PILOT_ADMIN_NAME: ${{ vars.PILOT_ADMIN_NAME }}
          PILOT_ADMIN_EMAIL: ${{ vars.PILOT_ADMIN_EMAIL }}
          PILOT_ADMIN_PASSWORD: ${{ secrets.PILOT_ADMIN_PASSWORD }}
          PSICOGEST_SUPABASE_DB_PASSWORD: ${{ secrets.PSICOGEST_SUPABASE_DB_PASSWORD }}
        run: python ops/bootstrap_pilot_admin.py
