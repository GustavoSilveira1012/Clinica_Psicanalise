name: PsicoGest quality gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend/psicogest/psicogest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Require Docker for database and Redis integration tests
        run: docker info
      - run: bash ./mvnw --batch-mode verify
      - name: Preserve backend test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: backend/psicogest/psicogest/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  migration-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check migration sequence
        shell: bash
        run: |
          test -f backend/psicogest/psicogest/src/main/resources/bd/migration/V64__create_saas_core.sql
          test -f backend/psicogest/psicogest/src/main/resources/bd/migration/V65__tenant_columns_expand.sql
          if grep -RniE '(password|secret|private[_-]?key|api[_-]?key)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9+/=_-]{12,}' --include='*.sql' backend/psicogest/psicogest/src/main/resources/bd/migration; then
            echo 'Potential secret found in SQL migrations'
            exit 1
          fi
          versions=$(find backend/psicogest/psicogest/src/main/resources/bd/migration -maxdepth 1 -type f -name 'V*.sql' -printf '%f\n' | sed -E 's/^V([0-9]+(_[0-9]+)*)__.*/\1/' | sort -V)
          duplicates=$(printf '%s\n' "$versions" | uniq -d)
          test -z "$duplicates"

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only used to render the local dependency compose file in CI.
      POSTGRES_PASSWORD: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v7
      - name: Validate dependency compose
        run: docker compose config --quiet
      - name: Build API image
        run: docker build --file backend/psicogest/psicogest/Dockerfile backend/psicogest/psicogest
      - name: Build frontend image
        run: docker build --file frontend/Dockerfile frontend
