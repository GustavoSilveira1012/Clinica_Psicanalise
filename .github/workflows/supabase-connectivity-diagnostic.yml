name: Supabase PostgreSQL TLS connectivity diagnostic

on:
  push:
    branches:
      - codex/render-homologacao
    paths:
      - .github/workflows/supabase-connectivity-diagnostic.yml

permissions:
  contents: read

jobs:
  postgres-tls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the approved Supabase session pooler answers PostgreSQL TLS
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          import ssl
          import sys

          host = "aws-0-us-east-1.pooler.supabase.com"
          try:
              with socket.create_connection((host, 5432), timeout=12) as raw:
                  raw.settimeout(12)
                  raw.sendall(bytes.fromhex("0000000804d2162f"))
                  response = raw.recv(1)
                  if response != b"S":
                      raise RuntimeError("PostgreSQL server did not accept TLS negotiation")
                  with ssl.create_default_context(cafile="backend/psicogest/psicogest/certs/supabase-prod-ca-2021.crt").wrap_socket(raw, server_hostname=host) as verified:
                      if verified.version() is None:
                          raise RuntimeError("TLS session was not established")
              print("Supabase session pooler accepted PostgreSQL TLS with hostname verification")
          except (OSError, ssl.SSLError, RuntimeError) as exc:
              print(f"Supabase PostgreSQL TLS connectivity failed: {type(exc).__name__}", file=sys.stderr)
              raise SystemExit(1)
          PY
