spring.application.name=psicogest

# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/psicogest}

spring.datasource.username=${DATABASE_USERNAME:postgres}

spring.datasource.password=${DATABASE_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# FLYWAY
# ==========================================
spring.flyway.locations=classpath:bd/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
app.scheduling.enabled=${SCHEDULING_ENABLED:false}

# Account action email delivery is opt-in. Never expose SMTP credentials to the frontend.
app.auth-actions.mail.enabled=${AUTH_ACTION_MAIL_ENABLED:false}
app.auth-actions.mail.required-for-readiness=${AUTH_ACTION_MAIL_REQUIRED_FOR_READINESS:false}
app.auth-actions.mail.from=${AUTH_ACTION_MAIL_FROM:}
app.auth-actions.mail.public-base-url=${AUTH_ACTION_PUBLIC_BASE_URL:}
app.auth-actions.mail.rate-limit-key=${AUTH_ACTION_RATE_LIMIT_KEY:}
app.auth-actions.mail.requests-per-ip=${AUTH_ACTION_REQUESTS_PER_IP:10}
app.auth-actions.mail.requests-per-address=${AUTH_ACTION_REQUESTS_PER_ADDRESS:3}
app.auth-actions.mail.rate-limit-window=${AUTH_ACTION_RATE_LIMIT_WINDOW:PT1H}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}

# ==========================================
# SECURITY
# ==========================================
app.security.allowed-origins=${SECURITY_ALLOWED_ORIGINS:http://localhost:5173}

app.security.jwt.issuer=psicogest-api
app.security.jwt.audience=psicogest-web

app.security.jwt.access-token-ttl=PT10M
app.security.jwt.refresh-token-ttl=P14D

app.security.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION:file:./secrets/jwt-public.pem}
app.security.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION:file:./secrets/jwt-private.pem}

app.security.jwt.key-id=${JWT_KEY_ID:primary-2026}

app.security.jwt.refresh-cookie-name=psicogest_rt
app.security.jwt.secure-cookie=${JWT_COOKIE_SECURE:false}

app.security.mfa.challenge-ttl=PT5M
app.security.mfa.max-attempts=5
app.security.mfa.issuer=PsicoGest

app.security.mfa.encryption-key=${MFA_ENCRYPTION_KEY:}

app.security.alert.email.endpoint=${SECURITY_ALERT_EMAIL_ENDPOINT:}
app.security.alert.cloud-monitoring.endpoint=${SECURITY_ALERT_CLOUD_MONITORING_ENDPOINT:}
app.security.alert.pagerduty.endpoint=${SECURITY_ALERT_PAGERDUTY_ENDPOINT:}
app.security.alert.siem.endpoint=${SECURITY_ALERT_SIEM_ENDPOINT:}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false

# External provider adapters are optional for local development and are
# required by the production readiness gate.
app.integrations.require-real-providers=${REQUIRE_REAL_PROVIDERS:false}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.export.prometheus.enabled=true

# LOGIN

app.security.rate-limit.login-ip.capacity=30
app.security.rate-limit.login-ip.refill-period=PT5M

app.security.rate-limit.login-account.capacity=10
app.security.rate-limit.login-account.refill-period=PT15M


# REFRESH

app.security.rate-limit.refresh-ip.capacity=120
app.security.rate-limit.refresh-ip.refill-period=PT1M


# MFA

app.security.rate-limit.mfa-ip.capacity=30
app.security.rate-limit.mfa-ip.refill-period=PT5M

app.security.rate-limit.mfa-challenge.capacity=8
app.security.rate-limit.mfa-challenge.refill-period=PT5M

# OUTBOUND NOTIFICATIONS — limits are intentionally independent from inbound auth limits.
# Keep provider credentials and production values outside Git.
app.notifications.outbound-rate-limit.email.capacity=${NOTIFICATION_EMAIL_RATE_LIMIT:1000}
app.notifications.outbound-rate-limit.email.refill-period=${NOTIFICATION_EMAIL_RATE_WINDOW:PT1H}
app.notifications.outbound-rate-limit.whatsapp.capacity=${NOTIFICATION_WHATSAPP_RATE_LIMIT:500}
app.notifications.outbound-rate-limit.whatsapp.refill-period=${NOTIFICATION_WHATSAPP_RATE_WINDOW:PT1H}
app.notifications.outbound-rate-limit.sms.capacity=${NOTIFICATION_SMS_RATE_LIMIT:500}
app.notifications.outbound-rate-limit.sms.refill-period=${NOTIFICATION_SMS_RATE_WINDOW:PT1H}

# SaaS commercial policy. Trial duration is configuration, not business logic hardcode.
app.saas.trial-days=${SAAS_TRIAL_DAYS:14}
