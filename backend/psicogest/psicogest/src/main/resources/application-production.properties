spring.config.activate.on-profile=production

# Production secrets must be injected by the platform secret manager.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# The production profile must never issue a refresh token cookie over plain
# HTTP. The validator also fails startup when this is explicitly disabled.
app.security.jwt.secure-cookie=${JWT_COOKIE_SECURE:true}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.url=${DATABASE_URL}
spring.flyway.user=${MIGRATION_DATABASE_USERNAME}
spring.flyway.password=${MIGRATION_DATABASE_PASSWORD}

app.security.crypto.provider=secret-managed
app.security.crypto.current-key-id=primary
app.security.crypto.local-keys.primary=${CLINICAL_KEK}
app.security.audit.current-key-id=primary
app.security.audit.keys.primary=${AUDIT_HMAC_KEY}

app.security.allowed-origins=${SECURITY_ALLOWED_ORIGINS}
app.security.jwt.public-key=${JWT_PUBLIC_KEY_LOCATION}
app.security.jwt.private-key=${JWT_PRIVATE_KEY_LOCATION}
app.security.mfa.encryption-key=${MFA_ENCRYPTION_KEY}

app.security.alert.email.endpoint=${SECURITY_ALERT_EMAIL_ENDPOINT:}
app.security.alert.cloud-monitoring.endpoint=${SECURITY_ALERT_CLOUD_MONITORING_ENDPOINT:}
app.security.alert.pagerduty.endpoint=${SECURITY_ALERT_PAGERDUTY_ENDPOINT:}
app.security.alert.siem.endpoint=${SECURITY_ALERT_SIEM_ENDPOINT:}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

# Each production integration is required by default. Operators must disable
# only providers explicitly excluded from a limited pilot scope.
app.integrations.require-real-providers=${REQUIRE_REAL_PROVIDERS:true}
# Integrations are gated independently so a clinical-operational pilot can
# explicitly keep uncontracted commercial/fiscal channels disabled. If unset,
# each gate inherits the stricter legacy REQUIRE_REAL_PROVIDERS setting.
app.integrations.require-payment-providers=${REQUIRE_PAYMENT_PROVIDERS:${app.integrations.require-real-providers}}
app.integrations.require-notification-providers=${REQUIRE_NOTIFICATION_PROVIDERS:${app.integrations.require-real-providers}}
app.integrations.require-national-nfse=${REQUIRE_NATIONAL_NFSE:${app.integrations.require-real-providers}}
app.scheduling.enabled=${SCHEDULING_ENABLED:false}
app.auth-actions.mail.enabled=${AUTH_ACTION_MAIL_ENABLED:false}
app.auth-actions.mail.required-for-readiness=${AUTH_ACTION_MAIL_REQUIRED_FOR_READINESS:true}
app.auth-actions.mail.from=${AUTH_ACTION_MAIL_FROM:}
app.auth-actions.mail.public-base-url=${AUTH_ACTION_PUBLIC_BASE_URL:}
app.auth-actions.mail.rate-limit-key=${AUTH_ACTION_RATE_LIMIT_KEY:}
app.auth-actions.mail.requests-per-ip=${AUTH_ACTION_REQUESTS_PER_IP:10}
app.auth-actions.mail.requests-per-address=${AUTH_ACTION_REQUESTS_PER_ADDRESS:3}
app.auth-actions.mail.rate-limit-window=${AUTH_ACTION_RATE_LIMIT_WINDOW:PT1H}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}
app.pilot.clinical-only=${CLINICAL_ONLY_PILOT:true}
app.pilot.clinical-data-enabled=${CLINICAL_DATA_ENABLED:false}
# A second, explicit release approval is required; one mistaken flag cannot expose clinical routes.
app.pilot.clinical-data-release-approved=${CLINICAL_DATA_RELEASE_APPROVED:false}

# Clinical exports must never fall back to container-local storage in production.
# Keep exports unavailable until a private durable object-storage adapter is installed.
app.export-storage.type=${CLINICAL_EXPORT_STORAGE_TYPE:disabled}
app.export-storage.required-for-readiness=${CLINICAL_EXPORT_STORAGE_REQUIRED:true}
app.export-storage.supabase.endpoint=${SUPABASE_S3_ENDPOINT:}
app.export-storage.supabase.region=${SUPABASE_S3_REGION:}
app.export-storage.supabase.bucket=${SUPABASE_S3_BUCKET:}
app.export-storage.supabase.access-key=${SUPABASE_S3_ACCESS_KEY:}
app.export-storage.supabase.secret-key=${SUPABASE_S3_SECRET_KEY:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,redis,externalProviders
management.endpoint.health.group.liveness.include=livenessState
management.metrics.export.prometheus.enabled=true

app.notifications.outbound-rate-limit.email.capacity=${NOTIFICATION_EMAIL_RATE_LIMIT:1000}
app.notifications.outbound-rate-limit.email.refill-period=${NOTIFICATION_EMAIL_RATE_WINDOW:PT1H}
app.notifications.outbound-rate-limit.whatsapp.capacity=${NOTIFICATION_WHATSAPP_RATE_LIMIT:500}
app.notifications.outbound-rate-limit.whatsapp.refill-period=${NOTIFICATION_WHATSAPP_RATE_WINDOW:PT1H}
app.notifications.outbound-rate-limit.sms.capacity=${NOTIFICATION_SMS_RATE_LIMIT:500}
app.notifications.outbound-rate-limit.sms.refill-period=${NOTIFICATION_SMS_RATE_WINDOW:PT1H}

app.saas.trial-days=${SAAS_TRIAL_DAYS:14}
